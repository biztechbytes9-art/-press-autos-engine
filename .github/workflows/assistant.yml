name: press.autos editor's assistant

on:
  schedule:
    - cron: "47 * * * *"       # every hour at minute 47 (the engine runs at minute 17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine                # never at the same time as the engine (they share the memory file)
  cancel-in-progress: false

jobs:
  assist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check drafts
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m engine.assistant

      - name: Save memory
        if: always()
        run: |
          git config user.name "press-autos-engine"
          git config user.email "engine@users.noreply.github.com"
          git add state/engine.db state/assistant.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "assistant state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
