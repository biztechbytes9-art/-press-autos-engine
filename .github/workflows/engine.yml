name: press.autos engine

on:
  schedule:
    - cron: "17 */2 * * *"     # every 2 hours, at minute 17 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (find and rank stories, post nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run engine
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m engine.run --dry-run
          else
            python -m engine.run
          fi

      - name: Save engine memory
        if: always()
        run: |
          git config user.name "press-autos-engine"
          git config user.email "engine@users.noreply.github.com"
          git add state/engine.db
          git diff --cached --quiet || git commit -m "engine state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
