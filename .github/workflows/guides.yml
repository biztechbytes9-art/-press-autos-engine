name: press.autos guides

on:
  schedule:
    - cron: "41 4 * * 1"       # Mondays 04:41 UTC (10:11 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (write nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write guides
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python -m engine.guides --dry-run; else python -m engine.guides; fi
      - name: Save memory
        if: always()
        run: |
          git config user.name "press-autos-engine"
          git config user.email "engine@users.noreply.github.com"
          git add state/engine.db state/runs.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "guides state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
