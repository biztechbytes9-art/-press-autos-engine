# press.autos content engine settings.
# Edit this file on GitHub to change behaviour; no code changes needed.

site:
  # Secrets (WP_URL, WP_USER, WP_APP_PASSWORD, ANTHROPIC_API_KEY) are set in
  # GitHub > Settings > Secrets and variables > Actions, never in this file.
  user_agent: "press.autos-engine/1.0 (+https://press.autos/editorial-policy/)"
  post_status: pending        # pending = goes to the review queue. Never "publish".
  editor_name: Karim

limits:
  per_run_max_articles: 3     # across all editions; the workflow runs every 2 hours
  daily_max_total_articles: 20  # all editions together: keep this to what you can review in a day
  daily_max_usd: 3.50         # hard stop on PAID AI spend per day (free models cost $0)
  max_sources: 2              # source pages read per story (kept small for free per-minute limits)
  source_chars: 6000          # characters read from each source page
  min_score: 0.45             # skip weak stories rather than publish filler
  lookback_hours: 36          # only consider items this recent
  max_category_share: 0.5     # within an edition, no category gets more than half of its daily drafts
  max_candidates_per_source: 4  # at most this many candidate stories led by one website per run (stops one blog dominating)

# Images: only pictures we may publish. Official press photos (sites with source_authority 1.0), credited;
# otherwise a generated press.autos news card. Photos from news sites are never used.
images:
  enabled: true
  official_photos: true   # use the maker's/regulator's own press photos when the story has an official source
  inline_photo: true      # also place a second official photo inside the article
  news_card: true         # otherwise generate a branded card (headline, category, key figures)

# Where stories go. Each story's country decides its edition.
# - "global" is the main site (WP_URL secret).
# - A country edition is used only when enabled: true. Its site must exist in WordPress
#   with the same categories/tags imported and the pipeline user added to it.
# - Local stories for a country without an enabled edition follow local_without_edition.
local_without_edition: global   # "global" = post on the main site with the country in the title; "skip" = ignore
editions:
  global:
    name: press.autos
    url: secret                   # uses the WP_URL secret
    daily_max_articles: 10
    style: "Global audience. Metric units first; add US units in brackets for US/UK stories. Prices in the source currency, with USD in brackets if the source gives it."

  # Country editions. To switch one on: create the site in WordPress (see README), then set enabled: true.
  # source_language: english = only English-language local news; any = also read local-language news
  # (GDELT searches translated text), always written in English.
  IN:
    name: press.autos India
    url: https://india.press.autos
    enabled: true
    daily_max_articles: 6
    source_language: english
    style: "India edition for local buyers. Prices in rupees using lakh/crore (e.g. Rs 12.5 lakh, ex-showroom) exactly as the source states. Mention variants, ex-showroom vs on-road, bookings and deliveries when the source gives them. Do not add the country to the title."
    gdelt_queries:
      - '(car OR SUV OR EV OR "electric vehicle" OR motorcycle OR scooter) (launch OR launched OR price OR unveiled OR recall OR sales) sourcecountry:india sourcelang:english'
      - '(Maruti OR Tata OR Mahindra OR Hyundai OR Kia OR Toyota OR "Royal Enfield" OR "Hero MotoCorp" OR Bajaj OR TVS OR Ather OR Ola) (launch OR price OR sales OR recall) sourcecountry:india sourcelang:english'
      - '(Vahan OR FADA OR SIAM) (sales OR registrations) sourcecountry:india sourcelang:english'
    feeds:   # Indian car and bike news (read only while this edition is enabled)
      - {name: RushLane, url: "https://www.rushlane.com/feed"}
      - {name: GaadiWaadi, url: "https://gaadiwaadi.com/feed/"}
      - {name: MotorBeam, url: "https://www.motorbeam.com/feed/"}
      - {name: Motoroids, url: "https://www.motoroids.com/feed/"}
