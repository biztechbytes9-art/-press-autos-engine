# AI models. FREE providers first; the engine falls back down each list when a model is
# rate-limited or has no key. Add keys as GitHub secrets: GROQ_API_KEY (main, free),
# GEMINI_API_KEY (free, optional), OPENROUTER_API_KEY (free, optional), ANTHROPIC_API_KEY (paid, optional).
# Free limits change: check each provider's console and adjust rpm/tpm/rpd/tpd below.
# If a model name stops working, replace it with a current free model from that provider's model list.
llm:
  providers:
    groq:       {type: openai, base_url: "https://api.groq.com/openai/v1", key_env: GROQ_API_KEY}
    gemini:     {type: gemini, base_url: "https://generativelanguage.googleapis.com/v1beta", key_env: GEMINI_API_KEY}   # works with new AQ. keys
    openrouter: {type: openai, base_url: "https://openrouter.ai/api/v1", key_env: OPENROUTER_API_KEY}
    anthropic:  {type: anthropic, key_env: ANTHROPIC_API_KEY}
  models:
    groq-gpt-oss:      {provider: groq, model: "openai/gpt-oss-120b", rpm: 28, tpm: 7500, rpd: 950, tpd: 190000, extra: {reasoning_effort: low}}
    groq-qwen:         {provider: groq, model: "qwen/qwen3.8-27b", rpm: 28, tpm: 7500, rpd: 950, tpd: 190000}
    gemini-flash-lite: {provider: gemini, model: "gemini-3.5-flash-lite", rpm: 10, rpd: 450}
    gemini-flash:      {provider: gemini, model: "gemini-3.8-flash", rpm: 5, rpd: 18}
    openrouter-gemma:  {provider: openrouter, model: "google/gemma-4-31b-it:free", rpm: 18, rpd: 45}
    claude-haiku:      {provider: anthropic, model: claude-haiku-5-5, price_in: 0.10, price_out: 0.50}
    claude-sonnet:     {provider: anthropic, model: claude-sonnet-5-5, price_in: 2.00, price_out: 10.00}
  roles:   # tried in this order
    triage: [gemini-flash-lite, groq-qwen, openrouter-gemma, claude-haiku]
    writer: [groq-gpt-oss, gemini-flash, groq-qwen, openrouter-gemma, claude-sonnet]
    verify: [groq-qwen, gemini-flash-lite, groq-gpt-oss, openrouter-gemma, claude-sonnet]   # a different model checks the writer's work

# Our category slugs (must exist in WordPress) and what belongs in each.
categories:
  ev: "Electric cars and electric bikes: launches, range, charging, prices, incentives"
  motorcycles: "Motorcycles and scooters (non-electric or general two-wheeler news)"
  used-cars: "Used-car market, values, buying advice"
  suvs: "SUV and crossover launches and news (non-EV focus)"
  commercial: "Pickups, vans, trucks, fleets"
  tech: "Car technology: ADAS, software, batteries, infotainment, safety tech"
  motorsport: "Racing series and motorsport business"
  reviews: "Reviews (only if the source is an official spec release we can summarise)"
  compare: "Comparisons (rarely from news)"
  trends: "Sales figures, registrations, market data, industry reports"

# Words that make a story more relevant (weights add up, capped at 1.0).
relevance_keywords:
  launch: 0.35
  unveil: 0.3
  reveal: 0.25
  price: 0.3
  recall: 0.4
  sales: 0.3
  registrations: 0.3
  electric: 0.25
  ev: 0.25
  battery: 0.2
  charging: 0.2
  range: 0.15
  motorcycle: 0.25
  scooter: 0.2
  suv: 0.2
  facelift: 0.25
  specs: 0.2
  booking: 0.2

