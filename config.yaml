# GDELT global news search (free, 1 request per 5 seconds). One query per line.
gdelt:
  enabled: true
  timespan: "12h"
  max_records: 75
  queries:
    - '("electric car" OR "electric vehicle" OR EV) (launch OR unveils OR price) sourcelang:english'
    - '(recall) (vehicles OR cars OR SUVs OR motorcycles) sourcelang:english'
    - '("car sales" OR registrations OR "EV sales") (October OR November OR December OR monthly) sourcelang:english'
    - '(motorcycle OR scooter) (launch OR unveils OR price) sourcelang:english'

